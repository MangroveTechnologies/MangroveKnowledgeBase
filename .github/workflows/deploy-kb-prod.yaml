name: Deploy KB Server to Prod

on:
  workflow_run:
    workflows: ["Deploy KB Server to Dev"]
    types:
      - completed
  workflow_dispatch:

env:
  REGION: us-central1
  GCP_REPO_PROJECT: mangroveai-platform
  REPO_NAME: mangrove-ai-repo
  KB_SERVICE_NAME: mangrove-knowledgebase-prod
  KB_IMAGE_NAME: mangrove-ai-kb
  KB_URL: kb.mangrovedeveloper.ai

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PROD_SA_KEY }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.KB_SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.KB_IMAGE_NAME }}:latest

      - name: Health Check
        run: |
          echo "Waiting for service..."
          sleep 30
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors \
            "https://${{ env.KB_URL }}/api/status"

      - name: Deployment Summary
        if: success()
        run: |
          echo "==================== KB PROD DEPLOYMENT SUCCESSFUL ===================="
          echo "Service: ${{ env.KB_SERVICE_NAME }}"
          echo "URL: https://${{ env.KB_URL }}"
          echo "======================================================================="
