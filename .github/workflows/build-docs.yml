name: Build and Push Docs Image

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'Dockerfile.docs'
  workflow_dispatch:

env:
  REGION: us-central1
  GCP_REPO_PROJECT: mangroveai-platform
  REPO_NAME: mangrove-ai-repo
  DOCS_IMAGE_NAME: mangrove-ai-docs

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_AR_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docs Docker image
        run: |
          docker build \
            -f Dockerfile.docs \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.DOCS_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.DOCS_IMAGE_NAME }}:latest \
            .

      - name: Push Docs Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.DOCS_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.DOCS_IMAGE_NAME }}:latest

      - name: Build Summary
        if: success()
        run: |
          echo "==================== DOCS IMAGE BUILD SUCCESSFUL ===================="
          echo "Image: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.DOCS_IMAGE_NAME }}"
          echo "Tags: ${{ github.sha }}, latest"
          echo "====================================================================="
