name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # Push the release tag with KB_RELEASE_PAT (not the default GITHUB_TOKEN) so the
          # tag push CASCADES to the tag-triggered workflows (build-and-push.yaml +
          # build-docs.yml). GITHUB_TOKEN-pushed tags do NOT trigger other workflows,
          # which is why the KB image/docs builds previously had to be dispatched by hand.
          token: ${{ secrets.KB_RELEASE_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r kb_server/requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Compute next version
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump }}
        run: |
          # Get latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          # Strip the v prefix and split
          CURRENT="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Bump based on input
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing: ${LATEST_TAG} -> v${NEW_VERSION}"

      - name: Create and push tag
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG"
          git push origin "$VERSION_TAG"

      - name: Build package
        run: |
          pip install build setuptools-scm
          python -m build

      - name: Verify built version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Expected: ${EXPECTED_VERSION}"
          BUILT=$(unzip -p dist/*.whl '*/METADATA' | grep '^Version:' | cut -d' ' -f2)
          echo "Built:    ${BUILT}"
          if [ "$BUILT" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## mangrove-kb ${{ steps.version.outputs.version }}

            ```bash
            pip install mangrove-kb==${{ steps.version.outputs.version }}
            ```
