name: Deploy KB Server to Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGION: us-central1
  GCP_REPO_PROJECT: mangroveai-platform
  REPO_NAME: mangrove-ai-repo
  KB_SERVICE_NAME: mangrove-knowledgebase-dev
  KB_IMAGE_NAME: mangrove-ai-kb
  KB_URL: devkb.mangrove.trade

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEV_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            -f kb_server/Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.KB_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.KB_IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.KB_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.KB_IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.KB_SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_REPO_PROJECT }}/${{ env.REPO_NAME }}/${{ env.KB_IMAGE_NAME }}:${{ github.sha }}

      - name: Health Check
        run: |
          echo "Waiting for service..."
          sleep 30
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors \
            "https://${{ env.KB_URL }}/api/status"

      - name: Deployment Summary
        if: success()
        run: |
          echo "==================== KB DEPLOYMENT SUCCESSFUL ===================="
          echo "Service: ${{ env.KB_SERVICE_NAME }}"
          echo "URL: https://${{ env.KB_URL }}"
          echo "==================================================================="
