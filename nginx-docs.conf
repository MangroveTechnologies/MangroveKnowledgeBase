proxy_cache_path /tmp/nginx-docs-cache levels=1:2 keys_zone=docs_cache:10m
                  max_size=100m inactive=10m use_temp_path=off;

server {
    listen 3000;

    # gzip compression for all text-based assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;

    # Serve static assets directly from the filesystem.
    # nginx decodes percent-encoded URLs before hitting the filesystem,
    # which fixes the (local)/%28local%29 mismatch in Next.js standalone.
    location /_next/static/ {
        alias /app/client/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Serve public directory assets
    location /public/ {
        alias /app/client/public/;
        expires 30d;
        access_log off;
    }

    # Proxy everything else to the Next.js standalone server
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache SSR responses (static docs site, safe to cache)
        # Next.js sends "private, no-cache, no-store" but this is a static
        # docs site so we override that and cache at the nginx layer.
        proxy_cache docs_cache;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 301 302 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
