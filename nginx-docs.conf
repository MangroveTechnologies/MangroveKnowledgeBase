server {
    listen 3000;

    # Serve static assets directly from the filesystem.
    # nginx decodes percent-encoded URLs before hitting the filesystem,
    # which fixes the (local)/%28local%29 mismatch in Next.js standalone.
    location /_next/static/ {
        alias /app/client/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Serve public directory assets
    location /public/ {
        alias /app/client/public/;
        expires 30d;
        access_log off;
    }

    # Proxy everything else to the Next.js standalone server
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
