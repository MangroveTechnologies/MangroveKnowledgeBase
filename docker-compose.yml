services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pytest", "tests/", "-v"]

  lint:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["flake8", "mangrove_kb/", "--max-line-length=120", "--ignore=E501,W503"]

networks:
  mangrove-network:
    name: mangrove-network
    external: true
