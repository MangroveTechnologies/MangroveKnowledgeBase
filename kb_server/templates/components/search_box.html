<form class="search-form" action="/search" method="GET" id="header-search-form">
    <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
        </svg>
        <input
            type="text"
            name="q"
            class="search-input"
            placeholder="Search knowledge base..."
            value="{{ query if query else '' }}"
            autocomplete="off"
            id="global-search"
        >
        <!-- Hidden field for selected tags -->
        <input type="hidden" name="tags" id="header-tags-hidden" value="{{ selected_tags|join(',') if selected_tags else '' }}">

        {% if all_tags %}
        <div class="header-tag-dropdown" id="headerTagDropdown">
            <button type="button" class="header-tag-btn" id="headerTagBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                    <line x1="7" y1="7" x2="7.01" y2="7"/>
                </svg>
                <span class="header-tag-label">Tags</span>
                <span class="header-tag-count" id="headerTagCount" style="display:none;">0</span>
            </button>
            <div class="header-tag-menu" id="headerTagMenu">
                <div class="header-tag-menu-header">
                    <span>Filter by tags</span>
                    <button type="button" class="header-clear-tags" id="headerClearTags">Clear</button>
                </div>
                <div class="header-tag-list">
                    {% for name in all_tags.keys()|sort %}
                    <label class="header-tag-item">
                        <input
                            type="checkbox"
                            value="{{ name }}"
                            class="header-tag-checkbox"
                            {% if selected_tags and name in selected_tags %}checked{% endif %}
                        >
                        <span>{{ name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
        </div>
        {% endif %}

        <button type="submit" class="header-search-btn" title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
        </button>
    </div>
</form>

<script>
(function() {
    const dropdown = document.getElementById('headerTagDropdown');
    if (!dropdown) return;

    const btn = document.getElementById('headerTagBtn');
    const menu = document.getElementById('headerTagMenu');
    const hiddenInput = document.getElementById('header-tags-hidden');
    const countBadge = document.getElementById('headerTagCount');
    const clearBtn = document.getElementById('headerClearTags');
    const checkboxes = dropdown.querySelectorAll('.header-tag-checkbox');

    function updateTags() {
        const selected = Array.from(checkboxes)
            .filter(cb => cb.checked)
            .map(cb => cb.value);

        hiddenInput.value = selected.join(',');

        if (selected.length > 0) {
            countBadge.textContent = selected.length;
            countBadge.style.display = 'inline-flex';
        } else {
            countBadge.style.display = 'none';
        }
    }

    btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        menu.classList.toggle('open');
    });

    document.addEventListener('click', function(e) {
        if (!dropdown.contains(e.target)) {
            menu.classList.remove('open');
        }
    });

    checkboxes.forEach(cb => cb.addEventListener('change', updateTags));

    clearBtn.addEventListener('click', function(e) {
        e.preventDefault();
        checkboxes.forEach(cb => cb.checked = false);
        updateTags();
    });

    // Initialize count on page load
    updateTags();
})();
</script>
