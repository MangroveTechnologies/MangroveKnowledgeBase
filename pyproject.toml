[build-system]
requires = ["setuptools>=68.0,<75", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mangrove-kb"
dynamic = ["version"]
description = "Open-source trading signals and technical indicators library"
readme = "PKG_README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.10"
authors = [
    {name = "Mangrove Technologies", email = "support@mangrove.ai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # `SwingDelta` and the deprecated `Divergence` find swing points with
    # `scipy.signal.argrelextrema`. Both catch the ImportError and return empty -- SwingDelta as NaN
    # ("could not compute"), Divergence as all-False ("no divergence", a claim it has not earned).
    # It was optional-and-undeclared, which meant `pip install mangrove-kb` shipped a ratified
    # indicator that four signals read and that silently produced nothing.
    "scipy>=1.11",
]

[project.optional-dependencies]
# Searching by MEANING. `KnowledgeGraph.ask` seeds from two indices; this encodes the question for
# the second of them. Both indices ship in the wheel, but a query has to be encoded by the same
# model that built the vectors, and there is no way to embed a phrase the model has not seen
# without the model.
#
# `onnxruntime` + `tokenizers` read an ONNX export of the same checkpoint that is bundled in the
# wheel (`mangrove_kb/data/onnx-encoder/`, written by `ontology/build_onnx_encoder.py`) -- no
# `torch`, no network, no download. Measured against the torch encoder this replaced, over this
# graph's corpus plus the question set `tests/test_the_graph_answers_questions.py` uses: cosine
# similarity min 0.99999982 / mean 1.0, so this is a lossless re-export, not an approximation.
# Loading it costs ~157 MiB RSS and ~0.3 s for the first question, against ~464 MiB and ~6.4 s for
# `sentence-transformers` (measured fresh-process, Python 3.11, `/proc/self/status`).
#
# Without this extra, `ask()` still answers, seeded by the LSA index alone. Worse, never broken.
semantic = [
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
]

# The torch encoder this library used before the ONNX export above, kept as a fallback rather than
# removed -- `DenseIndex.model` tries ONNX first and falls back to this only if the ONNX path
# cannot load. Nobody needs it to use `ask()`; it exists for a model swap that leaves this
# checkpoint behind, or a GPU host that wants torch's batching over onnxruntime's. Pulls the whole
# torch dependency tree, which is why it is its own extra and not folded into `semantic`:
#
#     pip install mangrove-kb                        285 MB    ask() answers 13 of 25
#     pip install mangrove-kb[semantic]              395 MB    ask() answers 18 of 25
#     pip install mangrove-kb[semantic-torch]      5,873 MB    ask() answers 18 of 25 (same answers)
#     ...with CPU-only torch installed first       1,438 MB    ask() answers 18 of 25
#
# 3.4 GB of the GPU figure is nvidia CUDA libraries and triton, for a GPU nothing here uses: the
# node vectors are precomputed, and the only inference is one short question per call.
#
# **CPU or GPU is chosen at install time, not here.** There is no `torch-cpu` on PyPI and torch
# publishes no extra for it -- the `+cpu` wheels carry the same version from a different index -- so
# no dependency declaration can express it. Install torch first to choose:
#
#     pip install torch --index-url https://download.pytorch.org/whl/cpu   # CPU
#     pip install mangrove-kb[semantic-torch]
semantic-torch = [
    "sentence-transformers>=3.0",
]

dev = [
    # Both encoder paths, so the suite exercises each. Without `semantic` CI installs a graph with
    # no way to embed a question at all, and every test that measures `ask()` fails on an
    # ImportError rather than on anything about the graph. `semantic-torch` is here only to keep
    # the fallback path from rotting unexercised; nothing in the default path needs it.
    "mangrove-kb[semantic]",
    "mangrove-kb[semantic-torch]",
    # Builds the semantic index (`ontology/build_semantic_index.py`); never needed to read one --
    # the query side folds a question through the saved projection with numpy alone.
    "scikit-learn>=1.3",
    "pytest>=7.0",
    # The audits compare our implementations against bukosabino `ta`. It used to be imported from a
    # hardcoded checkout path, which pinned them to one machine; 0.11.0 is the version that checkout
    # was, and it is the public PyPI release.
    "ta>=0.11.0",
    # The wave audits compare against pandas-ta as a second reference. It was never declared, so it
    # worked only on machines that happened to have it -- which is how the audits could pass locally
    # and fail on a clean install. Requires Python >= 3.12.
    "pandas_ta>=0.4.71b0; python_version >= '3.12'",
    # `tests/test_wheel_contents.py` imports setup.py to read the bundle list. Virtualenvs stopped
    # shipping setuptools in 3.12, so that test passed on a machine with it and would have failed on
    # a clean CI runner -- the build backend installs it in an isolated env, not this one.
    "setuptools>=68",
    # `tests/test_discoverability.py` reads the README's screenshots -- their mode and their aspect
    # ratio, because a palette-flattened PNG dithers the graph's fine lines and a 4:1 image floated
    # beside a paragraph leaves a column of nothing. Undeclared, it passed here (Anaconda ships it)
    # and failed on the runner: exactly the shape of the `ta` and `setuptools` notes above.
    "pillow>=10.0",
    # NOTE: `wiki-to-graph` is deliberately NOT declared here. It compiles the doc-derived half of
    # the graph (`ontology/wiki_to_atoms.py` consumes its build output) and the version we need is a
    # commit on `main` rather than the published 0.2.0 -- `--vocab`, which lets the wiki carry our
    # own relation vocabulary, is not in a release yet.
    #
    # A commit pin can only be written as a direct reference, and PyPI REFUSES any distribution
    # whose metadata contains one, in any extra: "400 Can't have direct dependency". Declaring it
    # here made the package unpublishable, which is not a trade worth making for a build-time tool
    # that regenerating the ontology needs and nothing else does.
    #
    # To regenerate the doc-derived half, install it alongside:
    #     pip install "wiki-to-graph @ git+https://github.com/MangroveTechnologies/wiki-to-graph@dcee8ac"
    # Declare it again once `wiki-to-graph>=0.3.0` is on PyPI and the pin can be a version.
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/MangroveTechnologies/MangroveKnowledgeBase"
Repository = "https://github.com/MangroveTechnologies/MangroveKnowledgeBase"

[tool.setuptools.packages.find]
include = ["mangrove_kb*"]

# Non-Python files INSIDE the package. Without this setuptools ships only `*.py`, and the viewer
# dies on a wheel install -- `python -m mangrove_kb.viz` raised FileNotFoundError on its own logo
# while every test passed, because the tests run from the source tree where the files are present.
# The graph and the skills are bundled separately by the build_py hook in setup.py, because those
# are copied in from OUTSIDE the package directory; these live inside it and only need declaring.
[tool.setuptools.package-data]
mangrove_kb = [
    "viz/assets/*.svg",      # the Mangrove wordmark, light and dark
    "viz/vendor/*.js",       # vendored 3d-force-graph -- the 3D view is dead without it
    "viz/*.sql",             # store schema
    # The semantic index: built from the graph by `ontology/build_semantic_index.py` and read with
    # numpy alone. It lives inside the package because it is data the library reads at runtime, not
    # documentation about it.
    "data/*.npz",
    # The ONNX encoder: `model.onnx` + `tokenizer.json`, exported by `ontology/build_onnx_encoder.py`.
    # 79.3 MiB compressed, of an 83.7 MiB wheel (model.onnx is 86.2 MiB raw; zip's DEFLATE gets
    # it to 79.0 MiB). Bundled rather than fetched at install or build time so
    # `KnowledgeGraph.load().ask()` needs no network at all, the same guarantee the rest of the
    # package already makes.
    "data/onnx-encoder/*",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    # Loads the `sentence-transformers` TORCH FALLBACK, which downloads ~90 MB the first time --
    # the default path is the bundled ONNX export and needs no network. Deselect with
    # `-m "not model"` on a machine with no network and no HuggingFace cache.
    "model: needs the sentence-transformers fallback model, not just the committed vectors",
]
